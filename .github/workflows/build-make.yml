name: Build binary (makefile)

# runs make every commit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev libusb-1.0

      - name: Build
        run: |
          make

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ux2_vu_daemon
          path: /
          if-no-files-found: error